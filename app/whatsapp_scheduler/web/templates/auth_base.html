<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attena Assistant{% endblock %}</title>
  <meta name="theme-color" content="#0E2B23">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E2B23'/%3E%3Cpath d='M14 46 L32 14 L50 46' fill='none' stroke='%23F7F5F0' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23 36 H41' fill='none' stroke='%23C8963E' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function(){
      try{
        var t = localStorage.getItem('theme');
        if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      }catch(e){}
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#F7F5F0; --fg:#101713; --card:#fff; --bd:#e0dcd1; --bd2:#c9c4b6; --mut:#5a6660;
      --accent:#1b4d3e; --accent-d:#0e2b23; --soft:rgba(27,77,62,.12);
      --err:#7a1f2b;
      --font-display:'Newsreader', Georgia, serif;
      --font-mono:'JetBrains Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme=light]){
        --bg:#0f1a15; --fg:#ede9e0; --card:#17251e; --bd:#263a30; --bd2:#354a3d; --mut:#8b9890;
        --accent:#2f6b4f; --accent-d:#4fae82; --soft:rgba(47,107,79,.18);
        --err:#e2685a;
      }
    }
    :root[data-theme=dark]{
      --bg:#0f1a15; --fg:#ede9e0; --card:#17251e; --bd:#263a30; --bd2:#354a3d; --mut:#8b9890;
      --accent:#2f6b4f; --accent-d:#4fae82; --soft:rgba(47,107,79,.18);
      --err:#e2685a;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      font:15px/1.5 Archivo,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg);
      -webkit-font-smoothing:antialiased;
    }
    a { color:var(--accent-d); }
    ::placeholder { color:var(--mut); }
    .auth-card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--bd); border-radius:16px; box-shadow:0 24px 64px rgba(16,23,19,.22); padding:36px 32px; }
    .auth-brand { width:52px; height:52px; border-radius:14px; background:#0e2b23; display:flex; align-items:center; justify-content:center; margin:0 auto; }
    .auth-brand-tag { display:block; text-align:center; margin:10px 0 0; font-family:var(--font-mono); font-size:10px; letter-spacing:.28em; color:var(--mut); }
    .auth-title { text-align:center; font-family:var(--font-display); font-size:28px; font-weight:500; margin:16px 0 2px; letter-spacing:-.015em; }
    .auth-sub { text-align:center; color:var(--mut); font-size:13.5px; margin:0 0 24px; }
    label { display:block; font-weight:600; font-size:.82rem; margin:14px 0 4px; }
    input { width:100%; padding:11px 13px; border:1px solid var(--bd2); border-radius:9px; background:var(--card); color:inherit; font:inherit; font-size:14px; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--soft); }
    button.primary { width:100%; margin-top:22px; padding:12px; border-radius:9px; border:0; background:var(--accent); color:#fff; font-weight:600; font-size:14.5px; cursor:pointer; }
    button.primary:hover { background:var(--accent-d); }
    .auth-forgot { text-align:right; margin-top:8px; }
    .auth-forgot a { font-size:12.5px; color:var(--mut); text-decoration:none; }
    .auth-forgot a:hover { color:var(--fg); }
    .auth-foot { text-align:center; margin-top:22px; padding-top:18px; border-top:1px solid var(--bd); font-size:13.5px; color:var(--mut); }
    .auth-foot a { font-weight:600; text-decoration:none; }
    .alert { padding:10px 14px; border-radius:9px; font-size:.87rem; margin-bottom:18px; }
    .alert.err { background:color-mix(in oklab, var(--err) 12%, transparent); border:1px solid color-mix(in oklab, var(--err) 35%, transparent); color:var(--err); }
    .alert.ok { background:var(--soft); border:1px solid color-mix(in oklab, var(--accent-d) 35%, transparent); color:var(--accent-d); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <svg width="30" height="30" viewBox="0 0 64 64" role="img" aria-label="Attena">
        <path d="M6 56 L32 8 L58 56" fill="none" stroke="#F7F5F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M18 40 H49" fill="none" stroke="#C8963E" stroke-width="5" stroke-linecap="round"></path>
        <circle cx="57.5" cy="40" r="3.6" fill="#C8963E"></circle>
      </svg>
    </div>
    <h1 class="auth-title">{% block card_title %}Attena{% endblock %}</h1>
    <span class="auth-brand-tag">ASSISTANT</span>
    <p class="auth-sub">{% block card_sub %}{% endblock %}</p>
    {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
    {% if ok %}<div class="alert ok">{{ ok }}</div>{% endif %}
    {% block form %}{% endblock %}
  </div>
</body>
</html>
