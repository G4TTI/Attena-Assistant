{% extends "auth_base.html" %}
{% block title %}Entrar — Attena Assistant{% endblock %}
{% block card_title %}Attena{% endblock %}
{% block card_sub %}Seu assistente inteligente{% endblock %}
{% block form %}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" placeholder="Digite seu e-mail" required autofocus value="{{ email_value or '' }}">
  <label for="password">Senha</label>
  <input id="password" name="password" type="password" placeholder="Digite sua senha" required>
  <div class="auth-forgot"><a href="/esqueci-senha">Esqueci minha senha</a></div>
  <button class="primary" type="submit">Entrar</button>
</form>
<div class="auth-foot">
  Ainda não tenho uma conta<br>
  <a href="/cadastro">Criar conta</a>
</div>
{% endblock %}
