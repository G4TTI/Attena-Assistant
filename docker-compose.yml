services:
  waha:
    # Fixe a versão em produção (ex.: WAHA_IMAGE=devlikeapro/waha:latest-2026.8.2):
    # antes da 2026.6.1 o WAHA só aceitava a sessão "default" e nenhum usuário
    # novo (session_name u_<hex>) conseguia conectar.
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    container_name: ${WAHA_CONTAINER_NAME:-waha-scheduler}
    restart: unless-stopped
    ports:
      # Só localhost: o app fala com o WAHA pela rede interna do Docker
      # (http://waha:3000). Publicar isto na rede expõe a API/dashboard do WAHA.
      - "127.0.0.1:${WAHA_HOST_PORT:-3001}:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-WEBJS}
      # Privacidade (v1.4): o dashboard e o Swagger do WAHA permitem LER as
      # conversas de todas as sessões — desligados por padrão. Só ligue
      # temporariamente, para depuração, e com senha forte.
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED:-false}
      WHATSAPP_SWAGGER_ENABLED: ${WHATSAPP_SWAGGER_ENABLED:-false}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      # QR Code nunca no log; logs do WAHA só com avisos/erros (o log de acesso
      # HTTP traria o chatId/telefone na URL).
      WAHA_PRINT_QR: ${WAHA_PRINT_QR:-False}
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-warn}
      WAHA_HTTP_LOG_LEVEL: ${WAHA_HTTP_LOG_LEVEL:-warn}
      # O Attena nunca pede mídia; nem por evento nem por API o WAHA baixa arquivos.
      WAHA_API_DOWNLOAD_MEDIA: ${WAHA_API_DOWNLOAD_MEDIA:-false}
      WAHA_EVENTS_DOWNLOAD_MEDIA: ${WAHA_EVENTS_DOWNLOAD_MEDIA:-false}
      # Reinicia a sessão automaticamente quando o container sobe
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    volumes:
      # Credenciais das sessões + perfil local do WhatsApp Web (engine WEBJS,
      # inclui o cache local de conversas do próprio WhatsApp Web). Trate como
      # segredo: ver docs/SECURITY_AND_PRIVACY.md -> WAHA.
      - ./waha/sessions:/app/.sessions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: ./app
    container_name: ${APP_CONTAINER_NAME:-whatsapp-scheduler}
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-8090}:8000"
    environment:
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      APP_ENV: ${APP_ENV:-development}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-attena_session}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-5}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-300}
      TICK_SECONDS: ${TICK_SECONDS:-30}
      MAX_OVERDUE_MINUTES: ${MAX_OVERDUE_MINUTES:-120}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      SEND_JITTER_SECONDS: ${SEND_JITTER_SECONDS:-1.5}
      DB_PATH: /app/data/app.db
      TZ: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8090/calendario/oauth/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      CALENDAR_SYNC_SECONDS: ${CALENDAR_SYNC_SECONDS:-300}
      # v1.4 — criptografia de dados (obrigatórias: sem elas o app não sobe).
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:-}
      DATA_ENCRYPTION_ACTIVE_VERSION: ${DATA_ENCRYPTION_ACTIVE_VERSION:-}
      DATA_HASH_KEY: ${DATA_HASH_KEY:-}
      # v1.4 — retenção, segurança, planos
      PRIVACY_CLEANUP_SECONDS: ${PRIVACY_CLEANUP_SECONDS:-3600}
      RECIPIENT_HASH_RETENTION_DAYS: ${RECIPIENT_HASH_RETENTION_DAYS:-30}
      LOGIN_IP_RETENTION_DAYS: ${LOGIN_IP_RETENTION_DAYS:-30}
      LOGIN_AUDIT_RETENTION_DAYS: ${LOGIN_AUDIT_RETENTION_DAYS:-180}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_SESSION_MAX_AGE_HOURS: ${ADMIN_SESSION_MAX_AGE_HOURS:-12}
      ENFORCE_PLAN_LIMITS: ${ENFORCE_PLAN_LIMITS:-false}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      WAHA_NOWEB_STORE_ENABLED: ${WAHA_NOWEB_STORE_ENABLED:-false}
    volumes:
      - ./data:/app/data
      # Codigo montado do host: reiniciar o container aplica mudancas sem rebuild.
      - ./app/whatsapp_scheduler:/srv/whatsapp_scheduler:ro
    depends_on:
      - waha
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
